[package]
name = "nssm-rs"
version = "0.1.0"
edition = "2024"
authors = ["nssm-rs Contributors"]
description = "A modern, reliable service manager and process supervisor inspired by NSSM, written in Rust"
license = "MIT"
readme = "README.md"
repository = "https://github.com/mahirgul/nssm-rs"
keywords = ["nssm", "service", "supervisor", "daemon", "windows-service"]
categories = ["command-line-utilities", "os"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
anyhow = "1.0"
ctrlc = "3.4"
regex = "1.11"
log = "0.4"
env_logger = "0.11"

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
windows-sys = { version = "0.59", features = ["Win32_System_Services", "Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }
