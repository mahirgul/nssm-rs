ShortDescription: Modern, cross-platform Non-Sucking Service Manager rewritten in Rust
Description: |-
  nssm-rs is a modern, high-performance, clean-room rewrite of NSSM (Non-Sucking Service Manager) in Rust.
  It allows running any program, batch script, or executable as a Windows Service or background Linux daemon.
  Features include native Win32 Service Controller integration, automatic restart on failure with exponential backoff,
  standard I/O redirection, and environment variable configuration.
